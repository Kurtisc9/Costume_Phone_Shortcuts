<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>SAGE Charging Mode</title>
<style>
@property --charge{syntax:"<percentage>";inherits:false;initial-value:0%}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010409;color:#eefaff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#010409}
.sage-character{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:min(62vw,300px);height:25vh;min-height:150px;max-height:245px;z-index:1;overflow:hidden;border-radius:22px;pointer-events:none;opacity:.96;filter:drop-shadow(0 0 18px rgba(0,190,255,.28));-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 76%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 76%,transparent 100%)}
.sage-character video{width:100%;height:100%;object-fit:cover;object-position:center 48%;filter:saturate(1.05) brightness(.82) contrast(1.12)}
.sage-character:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,transparent 25%,rgba(0,8,14,.18) 62%,rgba(0,4,8,.58) 100%)}
.screen{position:relative;width:100%;height:100dvh;min-height:650px;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 24px);isolation:isolate}
.screen:before{content:"";position:absolute;inset:0;z-index:-3;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(80,210,255,.025) 4px);pointer-events:none}
.ambient{position:absolute;width:115vw;height:55vh;top:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,184,255,.12),transparent 67%);filter:blur(12px);animation:breathe 4s ease-in-out infinite}
.header{text-align:center;margin-top:4.5vh;z-index:2}
.brand{font-size:clamp(24px,7vw,34px);font-weight:850;letter-spacing:.34em;margin-right:-.34em;background:linear-gradient(180deg,#fff 0,#a9eaff 38%,#3cc7ff 63%,#0b70a9 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(50,205,255,.65))}
.sub{margin-top:8px;font-size:9px;letter-spacing:.52em;margin-right:-.52em;color:#6bcff4;text-transform:uppercase;opacity:.85}
.stage{position:relative;width:min(86vw,390px);aspect-ratio:1;margin-top:5vh;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%}
.r1{inset:0;border:1px solid rgba(70,210,255,.34);box-shadow:0 0 28px rgba(0,174,255,.13);animation:spin 16s linear infinite}
.r1:before,.r1:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#72e3ff;box-shadow:0 0 15px #00bfff;top:10%;left:22%}.r1:after{top:auto;left:auto;right:12%;bottom:25%}
.r2{inset:7%;border:2px dashed rgba(43,193,255,.26);animation:spinR 22s linear infinite}
.r3{inset:13%;border:1px solid rgba(77,218,255,.55);box-shadow:inset 0 0 24px rgba(0,165,255,.12)}
.core{--charge:0%;position:absolute;inset:18%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 43%,rgba(8,34,55,.82) 0 35%,rgba(2,12,22,.88) 70%);box-shadow:0 0 28px rgba(0,177,255,.5),0 0 75px rgba(0,126,255,.25),inset 0 0 45px rgba(0,166,255,.24);backdrop-filter:blur(2px)}
.core:before{content:"";position:absolute;inset:-4px;border-radius:50%;padding:4px;background:conic-gradient(#66e6ff var(--charge),rgba(20,102,145,.24) 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 8px #00bfff)}
.core:after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(128,231,255,.24);animation:pulse 2.2s ease-in-out infinite}
.percent{position:relative;text-align:center;font-size:clamp(62px,20vw,96px);font-weight:800;letter-spacing:-.06em;line-height:.9;text-shadow:0 0 24px rgba(0,181,255,.7)}
.percent small{display:block;font-size:9px;letter-spacing:.45em;margin:18px 0 0 .45em;color:#70dcff;font-weight:650}
.bolt{position:absolute;bottom:7%;font-size:28px;color:#72e8ff;text-shadow:0 0 12px #00aaff;animation:bolt 1.6s ease-in-out infinite}
.telemetry{width:min(88vw,410px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:3.5vh}
.cell{border:1px solid rgba(70,203,255,.18);background:linear-gradient(180deg,rgba(8,34,52,.68),rgba(3,13,22,.64));padding:10px 5px;border-radius:10px;text-align:center;box-shadow:inset 0 1px rgba(170,235,255,.07);backdrop-filter:blur(7px)}
.cell b{display:block;font-size:8px;letter-spacing:.14em;color:#55cfff}.cell span{display:block;margin-top:5px;font-size:8px;letter-spacing:.09em;color:#9bb5c2}
.footer{margin-top:auto;text-align:center;padding-bottom:5px}
.kurtis{font-size:clamp(19px,5.5vw,26px);font-weight:850;letter-spacing:.24em;margin-right:-.24em;background:linear-gradient(105deg,#597b8d 0,#e9fbff 35%,#6fdcff 50%,#fff 64%,#55798b 100%);background-size:220% 100%;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 9px rgba(0,183,255,.55));animation:sheen 4s linear infinite}
.footerline{width:120px;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,#45d4ff,transparent);box-shadow:0 0 8px #00b7ff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}@keyframes pulse{50%{transform:scale(1.045);opacity:.45}}@keyframes bolt{50%{transform:scale(1.14);opacity:.65}}@keyframes breathe{50%{opacity:.58;transform:scale(1.05)}}@keyframes sheen{to{background-position:-220% 0}}
@media(max-height:760px){.header{margin-top:1vh}.stage{width:min(68vh,82vw);margin-top:2vh}.telemetry{margin-top:2vh}.cell{padding:7px 4px}}
@media(prefers-reduced-motion:reduce){.ring,.ambient,.bolt,.kurtis{animation:none!important}}
</style>
</head>
<body>
<main class="screen">
<div class="ambient"></div>
<header class="header"><div class="brand">SAGE</div><div class="sub">Adaptive Power Interface</div></header>
<section class="stage" aria-label="Battery charging status">
<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
<div class="core" id="core"><div class="percent"><span id="battery">--</span>%<small>POWER CORE</small></div></div>
<div class="bolt">ϟ</div>
</section>
<section class="telemetry">
<div class="cell"><b>POWER</b><span>CONNECTED</span></div>
<div class="cell"><b>SYSTEM</b><span>OPTIMIZING</span></div>
<div class="cell"><b>AI CORE</b><span>ONLINE</span></div>
</section>
<div class="sage-character" id="sageCharacter"><video id="sageVideo" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-label="Sage animated character"><source src="./Sage.MP4?v=3" type="video/mp4"></video></div>
<footer class="footer"><div class="kurtis">KURTISC</div><div class="footerline"></div></footer>
</main>
<script>
const params=new URLSearchParams(location.search);
const raw=params.get("battery")??"0";
const value=Math.max(0,Math.min(100,parseInt(raw,10)||0));
document.getElementById("battery").textContent=value;
document.getElementById("core").style.setProperty("--charge",value+"%");
const sageVideo=document.getElementById("sageVideo");
sageVideo.muted=true;
sageVideo.setAttribute("muted","");
const startVideo=()=>sageVideo.play().catch(()=>{});
if(sageVideo.readyState>=2) startVideo(); else sageVideo.addEventListener("canplay",startVideo,{once:true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden) startVideo()});
document.addEventListener("touchstart",startVideo,{once:true});
</script>
</body></html>
