<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>SAGE Charging Mode</title>
<style>
@property --charge{syntax:"<percentage>";inherits:false;initial-value:0%}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  overflow:hidden;
  background:#010409;
  color:#eefaff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{position:fixed;inset:0}
.screen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  isolation:isolate;
  background:#010409;
}
.master{
  position:absolute;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  overflow:hidden;
  pointer-events:none;
}
.master img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:50% 50%;
  max-width:none;
  max-height:none;
  user-select:none;
  -webkit-user-drag:none;
}
.master:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 61%,rgba(0,190,255,.08),transparent 24%),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(80,210,255,.012) 4px);
}
.stage{
  position:absolute;
  z-index:5;
  left:50%;
  top:64.1%;
  width:min(35vw,168px);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  display:grid;
  place-items:center;
  filter:drop-shadow(0 0 24px rgba(0,205,255,.48));
}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.r1{
  inset:0;
  border:1px solid rgba(100,225,255,.38);
  box-shadow:0 0 25px rgba(0,174,255,.18);
  animation:spin 16s linear infinite;
}
.r1:before,.r1:after{
  content:"";
  position:absolute;
  width:6px;height:6px;border-radius:50%;
  background:#8cecff;
  box-shadow:0 0 12px #00bfff;
  top:10%;left:22%;
}
.r1:after{top:auto;left:auto;right:12%;bottom:25%}
.r2{
  inset:7%;
  border:1.5px dashed rgba(65,205,255,.28);
  animation:spinR 22s linear infinite;
}
.r3{
  inset:13%;
  border:1px solid rgba(100,225,255,.45);
  box-shadow:inset 0 0 18px rgba(0,165,255,.12);
}
.r3:after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:50%;
  border-top:1px solid rgba(180,250,255,.85);
  border-right:1px solid transparent;
  border-bottom:1px solid transparent;
  border-left:1px solid transparent;
  filter:drop-shadow(0 0 7px rgba(80,220,255,.65));
  animation:spin 7s linear infinite;
}
.core{
  --charge:0%;
  position:absolute;
  inset:20%;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:radial-gradient(circle at 50% 46%,rgba(4,20,34,.9) 0 42%,rgba(1,9,16,.94) 72%);
  box-shadow:0 0 24px rgba(0,177,255,.5),0 0 58px rgba(0,126,255,.26),inset 0 0 32px rgba(0,166,255,.22);
  backdrop-filter:blur(1.5px);
}
.core:before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  padding:4px;
  background:conic-gradient(#b8f7ff 0%,#52dcff var(--charge),rgba(20,102,145,.18) 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  filter:drop-shadow(0 0 10px #5ce7ff);
}
.core:after{
  content:"";
  position:absolute;
  inset:8%;
  border-radius:50%;
  border:1px solid rgba(128,231,255,.24);
  animation:pulse 2.2s ease-in-out infinite;
}
.percent{
  position:relative;
  z-index:3;
  text-align:center;
  font-size:clamp(28px,8vw,39px);
  font-weight:850;
  letter-spacing:-.05em;
  line-height:.9;
  text-shadow:0 0 18px rgba(0,181,255,.9);
}
.percent small{
  display:block;
  margin:10px 0 0 .3em;
  font-size:6px;
  font-weight:700;
  letter-spacing:.3em;
  color:#9aefff;
}
.percent:after{
  content:"";
  position:absolute;
  left:-18%;right:-18%;top:-45%;
  height:24%;
  background:linear-gradient(180deg,transparent,rgba(125,235,255,.18),transparent);
  filter:blur(3px);
  pointer-events:none;
  animation:coreScan 3.8s ease-in-out infinite;
}
.percent:before{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:190%;height:190%;
  transform:translate(-50%,-50%);
  z-index:-1;
  border-radius:50%;
  background:radial-gradient(circle,rgba(105,230,255,.12),transparent 62%);
  animation:coreBreathe 2.8s ease-in-out infinite;
}
.bolt{
  position:absolute;
  bottom:5%;
  font-size:18px;
  color:#72e8ff;
  text-shadow:0 0 12px #00aaff;
  animation:bolt 1.6s ease-in-out infinite;
}
.stage:before{
  content:"";
  position:absolute;
  inset:-18%;
  z-index:-1;
  border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 12%,rgba(105,235,255,.16) 16%,transparent 22% 47%,rgba(45,201,255,.13) 52%,transparent 58% 82%,rgba(150,245,255,.12) 87%,transparent 93%);
  -webkit-mask:radial-gradient(circle,transparent 0 56%,#000 58% 61%,transparent 63%);
  mask:radial-gradient(circle,transparent 0 56%,#000 58% 61%,transparent 63%);
  filter:drop-shadow(0 0 8px rgba(60,220,255,.45));
  animation:energyOrbit 11s linear infinite;
}
.stage:after{
  content:"";
  position:absolute;
  inset:-34%;
  z-index:-1;
  border-radius:50%;
  background:radial-gradient(circle,rgba(72,224,255,.22) 0%,rgba(0,174,255,.10) 38%,transparent 68%);
  filter:blur(12px);
  animation:handGlow 2.4s ease-in-out infinite;
}
body[data-power="low"] .core{box-shadow:0 0 22px rgba(0,177,255,.35),0 0 48px rgba(0,126,255,.18),inset 0 0 34px rgba(0,166,255,.18)}
body[data-power="low"] .stage:before{animation-duration:16s;opacity:.45}
body[data-power="low"] .stage:after{animation-duration:3.8s;opacity:.45}
body[data-power="normal"] .stage:before{animation-duration:11s}
body[data-power="high"] .core{box-shadow:0 0 38px rgba(70,220,255,.72),0 0 105px rgba(0,166,255,.38),inset 0 0 58px rgba(85,225,255,.32)}
body[data-power="high"] .stage:before{animation-duration:7s;opacity:1}
body[data-power="high"] .stage:after{animation-duration:1.8s}
body[data-power="full"] .core{box-shadow:0 0 48px rgba(150,245,255,.9),0 0 135px rgba(0,195,255,.5),inset 0 0 68px rgba(120,240,255,.4);animation:fullCore 1.35s ease-in-out infinite}
body[data-power="full"] .stage:before{animation-duration:4.5s;filter:drop-shadow(0 0 14px rgba(150,245,255,.85))}
body[data-power="full"] .stage:after{animation:fullHalo 1.35s ease-in-out 3,handGlow 2.8s ease-in-out 4.05s infinite}
body[data-power="full"] .percent small{letter-spacing:.2em}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes pulse{50%{transform:scale(1.045);opacity:.45}}
@keyframes bolt{50%{transform:scale(1.14);opacity:.65}}
@keyframes energyOrbit{to{transform:rotate(360deg)}}
@keyframes handGlow{50%{opacity:.62;transform:scale(1.055)}}
@keyframes coreScan{0%,18%{transform:translateY(0);opacity:0}35%{opacity:.8}70%{transform:translateY(390%);opacity:.35}100%{transform:translateY(390%);opacity:0}}
@keyframes coreBreathe{50%{opacity:.58;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes fullCore{50%{transform:scale(1.025);filter:brightness(1.18)}}
@keyframes fullHalo{50%{opacity:1;transform:scale(1.18);filter:blur(9px) brightness(1.45)}}
@media(max-height:760px){
  .stage{width:min(33vw,158px);top:64%}
}
@media(prefers-reduced-motion:reduce){
  .ring,.bolt,.stage:before,.stage:after,.core:after,.percent:before,.percent:after,.r3:after{animation:none!important}
}
</style>
</head>
<body>
<main class="screen">
  <div class="master">
    <img src="./Assets/Sage_LockScreen_Master.png?v=1" alt="" aria-hidden="true">
  </div>
  <section class="stage" aria-label="Battery charging status">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core" id="core">
      <div class="percent"><span id="battery">--</span>%<small>POWER CORE</small></div>
    </div>
    <div class="bolt">ϟ</div>
  </section>
</main>
<script>
const params=new URLSearchParams(location.search);
const raw=params.get("battery")??"0";
const value=Math.max(0,Math.min(100,parseInt(raw,10)||0));
document.getElementById("battery").textContent=value;
document.getElementById("core").style.setProperty("--charge",value+"%");
const powerState=value<=20?"low":value<80?"normal":value<100?"high":"full";
document.body.dataset.power=powerState;
if(value===100) document.querySelector(".percent small").textContent="FULLY CHARGED";
</script>
</body>
</html>
